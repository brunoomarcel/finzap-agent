version: '3.8'

services:
  finzap-agent:
    image: ghcr.io/brunoomarcel/finzap-agent:latest
    networks:
      - vpsnet
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.finzap.rule=Host(`finzap-agent.curriculopronto.fun`)"
        - "traefik.http.routers.finzap.entrypoints=websecure"
        - "traefik.http.routers.finzap.tls=true"
        - "traefik.http.routers.finzap.tls.certresolver=letsencrypt"
        - "traefik.http.services.finzap.loadbalancer.server.port=3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}

networks:
  vpsnet:
    external: true
